services:
  db:
    image: postgres:16
    container_name: ums-postgres
    environment:
      POSTGRES_DB: university_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d university_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

