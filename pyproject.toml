[project]
name = "university-management-system"
version = "0.1.0"
description = "Backend-first University Management System built with FastAPI and PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "argon2-cffi>=23.1.0,<24.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "redis>=5.2.0,<6.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pip-audit>=2.8.0,<3.0.0",
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
seed-admin = "app.scripts.seed_admin:main"
seed-demo-data = "app.scripts.seed_demo_data:main"
security-check = "app.scripts.security_checks:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
